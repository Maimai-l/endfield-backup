<!-- @dsCard group="Brand" viewport="700x150" name="Radii & Shadows" subtitle="2px buttons → 6px on hover · soft ambient shadows only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);background:#fff}.row{display:flex;gap:8px}.sw{flex:1;height:72px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;box-sizing:border-box}.sw b{font:400 11px SpaceGrotesk,monospace}.sw span{font:400 10px SpaceGrotesk,monospace;opacity:.6}</style></head><body>
<div class="row" style="align-items:center;height:96px">
<div style="width:130px;height:44px;background:#383838;border-radius:2px;filter:var(--shadow-btn);color:#eee;display:flex;align-items:center;justify-content:center;font-family:SansMedium;font-size:13px">radius 2px</div>
<div style="width:130px;height:44px;background:#484848;border-radius:6px;filter:var(--shadow-btn);color:#fff;display:flex;align-items:center;justify-content:center;font-family:SansMedium;font-size:13px">hover 6px</div>
<div style="width:130px;height:64px;background:#fff;border-radius:4px;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:12px;color:#666">card 4px</div>
<div style="width:44px;height:44px;border-radius:50%;background:#fafafa;box-shadow:var(--shadow-round)"></div>
</div></body></html>
