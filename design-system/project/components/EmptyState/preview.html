<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EmptyState</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}body{padding-top:32px}.prov{position:absolute;top:12px;right:16px;z-index:5;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-checked);color:var(--color-on-checked);font:12px/1 var(--font-medium)}</style>
</head>
<body>
<span class="prov">新增</span>
<div class="stage">
      <div class="empties">
        <div class="empty"><span class="empty-ic"><svg class="ic ic--xl"><use href="#i-box"></use></svg></span><h5>还没有设备</h5><p>添加第一台设备后，这里会显示它的运行状态与负载。</p><button class="btn btn--primary btn--sm" type="button"><span class="lbl"><svg class="ic ic--plus"><use href="#i-plus"></use></svg>新建设备</span></button></div>
        <div class="empty"><span class="empty-ic"><svg class="ic ic--xl"><use href="#i-search"></use></svg></span><h5>没有匹配的结果</h5><p>当前筛选条件下没有设备。可以放宽状态或区域条件。</p><button class="btn btn--secondary btn--sm" type="button"><span class="lbl">清除筛选</span></button></div>
        <div class="empty"><span class="empty-ic"><svg class="ic ic--xl"><use href="#i-inbox"></use></svg></span><h5>数据加载失败</h5><p>南区网关未响应。请检查网络后重试。</p><button class="btn btn--secondary btn--sm" type="button"><span class="lbl"><svg class="ic ic--refresh"><use href="#i-refresh"></use></svg>重试</span></button></div>
      </div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
