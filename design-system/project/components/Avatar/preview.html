<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="row"><span class="row-label">尺寸</span><div class="items">
        <div class="item" style="justify-items:center"><span class="av" style="--s:24px">周</span><span class="cap">24</span></div>
        <div class="item" style="justify-items:center"><span class="av" style="--s:32px">周</span><span class="cap">32</span></div>
        <div class="item" style="justify-items:center"><span class="av" style="--s:40px">周</span><span class="cap">40</span></div>
        <div class="item" style="justify-items:center"><span class="av" style="--s:64px">周</span><span class="cap">64</span></div>
      </div></div>
      <div class="row"><span class="row-label">变体</span><div class="items">
        <div class="item" style="justify-items:center"><span class="av av--img" role="img" aria-label="头像图片"></span><span class="cap">图片</span></div>
        <div class="item" style="justify-items:center"><span class="av">林</span><span class="cap">文字</span></div>
        <div class="item" style="justify-items:center"><span class="av" role="img" aria-label="未设置头像"><svg class="ic"><use href="#i-user"></use></svg></span><span class="cap">占位</span></div>
        <div class="item" style="justify-items:center"><span class="av">陈<span class="dotst" aria-label="在线"></span></span><span class="cap">在线</span></div>
        <div class="item" style="justify-items:center"><span class="av">吴<span class="dotst off" aria-label="已归档"></span></span><span class="cap">已归档</span></div>
        <div class="item" style="justify-items:center"><button class="av is-hover" type="button" aria-label="账户：成员 302">周</button><span class="cap">可点击 hover</span></div>
        <div class="item" style="justify-items:center"><div class="av-stack"><span class="av" style="--s:32px">周</span><span class="av" style="--s:32px">林</span><span class="av" style="--s:32px">陈</span><span class="av more" style="--s:32px" role="img" aria-label="另外 4 人"><svg class="ic"><use href="#i-more"></use></svg></span></div><span class="cap">堆叠</span></div>
      </div></div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
