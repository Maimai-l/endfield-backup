<!-- @dsCard group="反馈与提示" height=314 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Toast</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="row"><span class="row-label">变体</span><div class="items" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div class="toast"><div class="msg">筛选条件已重置</div></div>
        <div class="toast toast--success"><svg class="ic"><use href="#s-success"></use></svg><div class="msg">工单 WO-2026-0930 已关闭</div><button class="act" type="button">撤销</button></div>
        <div class="toast toast--warning"><svg class="ic"><use href="#s-warning"></use></svg><div class="msg">3 台设备未同步，将在联网后重试</div></div>
        <div class="toast toast--error"><svg class="ic"><use href="#s-error"></use></svg><div class="msg">保存失败：网络连接已断开</div><button class="act" type="button">重试</button><button class="x" type="button" aria-label="关闭"><svg class="ic ic--close"><use href="#i-close"></use></svg></button></div>
      </div></div>
      <div class="row"><span class="row-label">演示</span><div class="items">
        <button class="btn btn--secondary btn--sm" type="button" data-toast="success" data-msg="工单 WO-2026-0930 已关闭" data-action="撤销"><span class="lbl">触发成功提示</span></button>
        <button class="btn btn--secondary btn--sm" type="button" data-toast="error" data-msg="保存失败：网络连接已断开" data-action="重试"><span class="lbl">触发错误提示</span></button>
        <span class="cap">出现在页面顶部居中，最多 3 条</span>
      </div></div>
    <div class="toast-stack" id="toasts" aria-live="polite"></div></div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
