<!-- @dsCard group="表单输入" height=223 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TextArea</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}body{padding-top:32px}.prov{position:absolute;top:12px;right:16px;z-index:5;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-checked);color:var(--color-on-checked);font:12px/1 var(--font-medium)}</style>
</head>
<body>
<span class="prov">新增</span>
<div class="stage">
      <div class="row"><span class="row-label">变体</span><div class="items">
        <div class="field" style="width:340px"><label class="field-label" for="ta1">故障描述</label><div class="input input--area"><textarea id="ta1" maxlength="200" data-max="200" placeholder="记录现象、发生时间和已采取的措施">06:40 巡检发现 A-02 驱动端异响，已降速至 60%。</textarea></div><div class="field-help"><span>最少 3 行，超出 10 行后滚动</span><span class="count" id="ta1c">26/200</span></div></div>
        <div class="field" style="width:340px"><label class="field-label" for="ta2">处理结论</label><div class="input input--area is-error"><textarea id="ta2" aria-invalid="true" aria-describedby="ta2e" placeholder="必填"></textarea></div><div class="field-help field-err" id="ta2e"><svg class="ic"><use href="#s-error"></use></svg>关闭工单前需要填写处理结论</div></div>
      </div></div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
