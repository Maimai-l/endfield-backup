<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>InteractionStates</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div style="padding:16px">
  <div class="states">
    <div class="st"><div class="st-name"><b>默认</b><span>rest</span></div><div class="st-desc">控件的静止外观。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary" type="button"><span class="lbl">保存</span></button></div><div class="st-cell"><div class="input input--sm"><input aria-label="编号" placeholder="编号"></div></div><div class="st-cell"><label class="check"><input type="checkbox"><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>启用</label></div></div></div>
    <div class="st"><div class="st-name"><b>悬停</b><span>:hover</span></div><div class="st-desc">底色加深一级，主要按钮竖条变为三角。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary is-hover" type="button"><span class="lbl">保存</span></button></div><div class="st-cell"><div class="input input--sm is-hover"><input aria-label="编号" placeholder="编号"></div></div><div class="st-cell"><label class="check is-hover"><input type="checkbox"><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>启用</label></div></div></div>
    <div class="st"><div class="st-name"><b>按下</b><span>:active</span></div><div class="st-desc">底色再加深一级，无位移、无缩放。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary is-hover is-active" type="button"><span class="lbl">保存</span></button></div><div class="st-cell"><button class="btn btn--secondary is-active" type="button"><span class="lbl">取消</span></button></div><div class="st-cell"></div></div></div>
    <div class="st"><div class="st-name"><b>焦点</b><span>:focus-visible</span></div><div class="st-desc">2px 焦点环，外偏移 2px。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary is-focus" type="button"><span class="lbl">保存</span></button></div><div class="st-cell"><div class="input input--sm is-focus"><input aria-label="编号" value="ID-000302"></div></div><div class="st-cell"><label class="check is-focus"><input type="checkbox" checked=""><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>启用</label></div></div></div>
    <div class="st"><div class="st-name"><b>选中</b><span>checked、aria-pressed</span></div><div class="st-desc">墨色填充配黄色标记，深色主题反转。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--secondary ibtn is-pressed" type="button" aria-pressed="true" aria-label="网格视图"><svg class="ic"><use href="#i-grid"></use></svg></button></div><div class="st-cell"><label class="switch"><input type="checkbox" role="switch" checked=""><span class="track"></span>通知</label></div><div class="st-cell"><label class="check"><input type="checkbox" checked=""><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>启用</label></div></div></div>
    <div class="st"><div class="st-name"><b>禁用</b><span>disabled</span></div><div class="st-desc">换为禁用色与禁用底，不用整体透明度。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary" type="button"disabled=""><span class="lbl">保存</span></button></div><div class="st-cell"><div class="input input--sm is-disabled"><input aria-label="编号" placeholder="编号" disabled=""></div></div><div class="st-cell"><label class="check"><input type="checkbox" checked="" disabled=""><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>启用</label></div></div></div>
    <div class="st st--msg"><div class="st-name"><b>错误</b><span>aria-invalid</span></div><div class="st-desc">描边换为错误色，下方给出原因与图标。</div><div class="st-demo"><div class="st-cell"></div><div class="st-cell"><div class="input input--sm is-error"><input aria-label="编号" value="ID-03" aria-invalid="true"></div><div class="field-help field-err"><svg class="ic"><use href="#s-error"></use></svg>应为 ID- 加 6 位数字</div></div><div class="st-cell"><label class="check is-error"><input type="checkbox"><span class="box"><svg class="ic tick"><use href="#i-check"></use></svg></span>同意服务条款</label></div></div></div>
    <div class="st"><div class="st-name"><b>加载</b><span>aria-busy</span></div><div class="st-desc">文字换为加载圈，按钮保持宽度。</div><div class="st-demo"><div class="st-cell"><button class="btn btn--primary is-loading" type="button"aria-busy="true"><span class="lbl">保存</span><span class="spin" aria-hidden="true"></span></button></div><div class="st-cell"><div class="input input--sm select" aria-busy="true"><span class="val ph">加载中</span><span class="spin spin--track" aria-hidden="true"></span></div></div><div class="st-cell"><label class="switch is-loading"><input type="checkbox" role="switch" checked="" disabled=""><span class="track"></span>同步</label></div></div></div>
  </div>
</div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
