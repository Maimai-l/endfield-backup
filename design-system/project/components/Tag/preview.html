<!-- @dsCard group="内容展示" height=240 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tag</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="row"><span class="row-label">变体</span><div class="items" style="gap:10px">
        <span class="tag">中性</span><span class="tag tag--accent">强调</span><span class="tag stat stat--ok">运行中</span><span class="tag stat stat--warn">待检修</span><span class="tag stat stat--err">停机</span><span class="tag stat">已排期</span>
        <span class="tag">电气<button class="rm" type="button" aria-label="移除 电气"><svg class="ic ic--close"><use href="#i-close"></use></svg></button></span>
      </div></div>
      <div class="row"><span class="row-label">尺寸</span><div class="items" style="gap:10px"><span class="tag tag--sm">sm 20</span><span class="tag">md 24</span><span class="tag tag--sm stat stat--ok">运行中</span><span class="tag stat stat--ok">运行中</span></div></div>
      <div class="row"><span class="row-label">状态点</span><div class="items" style="gap:16px"><span class="stat stat--ok">运行中</span><span class="stat stat--warn">待检修</span><span class="stat stat--err">停机</span><span class="stat stat--off">离线</span><span class="cap">表格与列表中使用，8px 方块，1px 墨色描边</span></div></div>
      <div class="row"><span class="row-label">源站</span><div class="items"><span class="tagdate"><span class="t">公告</span><span class="d">2026.09.30</span></span><span class="cap" style="align-self:center">类型加日期组合，仅用于公告与版本记录</span></div></div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
