<!-- @dsCard group="反馈与提示" height=424 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Dialog</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="scrim-stage">
        <div class="dialog" role="dialog" aria-labelledby="d1t">
          <div class="dlg-head"><h4 id="d1t">提交任务</h4><button class="cbtn" type="button" aria-label="关闭"><svg class="ic ic--close"><use href="#i-close"></use></svg></button></div>
          <div class="dlg-body"><p>提交后任务将进入审核，审核期间不可修改内容。</p>
            <div class="field" style="width:100%"><label class="field-label" for="dlgf">审核人</label><div class="input"><input id="dlgf" value="成员 302"></div></div></div>
          <div class="dlg-foot"><button class="btn btn--ghost" type="button"><span class="lbl">取消</span></button><button class="btn btn--primary" type="button"><span class="lbl">提交</span></button></div>
        </div>
        <div class="dialog dialog--danger" role="alertdialog" aria-labelledby="d2t">
          <div class="dlg-head"><h4 id="d2t">删除项目</h4><button class="cbtn cbtn--inv" type="button" aria-label="关闭"><svg class="ic ic--close"><use href="#i-close"></use></svg></button></div>
          <div class="dlg-body"><p>删除后该项目的 1,284 条记录将一并清除，且无法恢复。输入 <span class="confirm-code">PRJ-0142</span> 以确认。</p>
            <div class="input"><input aria-label="确认编号" placeholder="PRJ-0142"></div></div>
          <div class="dlg-foot"><button class="btn btn--ghost" type="button"><span class="lbl">取消</span></button><button class="btn btn--danger" type="button"><span class="lbl">删除</span></button></div>
        </div>
      </div>
      <div class="row"><span class="row-label">演示</span><div class="items">
        <button class="btn btn--secondary btn--sm" type="button" data-open="dlgA"><span class="lbl">打开确认对话框</span></button>
        <button class="btn btn--secondary btn--sm" type="button" data-open="dlgB"><span class="lbl">打开危险确认</span></button>
        <span class="cap">Esc 关闭，焦点锁定在对话框内</span>
      </div></div>
    <dialog class="real" id="dlgA" aria-labelledby="rA">
  <div class="dialog"><div class="dlg-head"><h4 id="rA">提交任务</h4><button class="cbtn" type="button" aria-label="关闭" data-close=""><svg class="ic ic--close"><use href="#i-close"></use></svg></button></div>
    <div class="dlg-body"><p>提交后任务将进入审核，审核期间不可修改内容。</p><div class="field" style="width:100%"><label class="field-label" for="rAf">审核人</label><div class="input"><input id="rAf" value="成员 302"></div></div></div>
    <div class="dlg-foot"><button class="btn btn--ghost" type="button" data-close=""><span class="lbl">取消</span></button><button class="btn btn--primary" type="button" data-close=""><span class="lbl">提交</span></button></div></div>
</dialog>
<dialog class="real" id="dlgB" aria-labelledby="rB">
  <div class="dialog dialog--danger"><div class="dlg-head"><h4 id="rB">删除项目</h4><button class="cbtn cbtn--inv" type="button" aria-label="关闭" data-close=""><svg class="ic ic--close"><use href="#i-close"></use></svg></button></div>
    <div class="dlg-body"><p>删除后该项目的 1,284 条记录将一并清除，且无法恢复。输入 <span class="confirm-code">PRJ-0142</span> 以确认。</p><div class="input"><input id="rBf" data-confirm="PRJ-0142" aria-label="确认编号" placeholder="PRJ-0142" autocomplete="off"></div></div>
    <div class="dlg-foot"><button class="btn btn--ghost" type="button" data-close=""><span class="lbl">取消</span></button><button class="btn btn--danger" type="button" id="rBgo" data-confirm-go disabled="" data-close=""><span class="lbl">删除</span></button></div></div>
</dialog></div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
