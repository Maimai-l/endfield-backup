<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Plate</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}body{padding-top:32px}.prov{position:absolute;top:12px;right:16px;z-index:5;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-checked);color:var(--color-on-checked);font:12px/1 var(--font-medium)}</style>
</head>
<body>
<span class="prov">新增</span>
<div class="stage">
  <div class="row"><span class="row-label">示例</span><div class="items" style="gap:24px;align-items:stretch;width:100%">
    <div class="plate" data-theme="dark" style="display:flex;flex-direction:column;width:168px;min-height:240px"><span class="kf-en">Tunnel</span><span class="cs-name" style="margin-top:0">外网访问</span><span class="cs-state">已开启</span><dl class="readout" style="margin-top:16px"><div><dt>隧道连接</dt><dd class="num">4</dd></div></dl><button class="pill pill--sm" type="button" style="margin-top:auto;align-self:flex-start"><span class="lbl">关闭</span></button></div>
    <div class="plate" data-theme="dark" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:16px"><div><span class="cs-state" style="margin-top:0;font:20px/28px var(--font-medium)">blender-assets</span></div><div class="prog" style="width:auto" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" aria-label="剩余时间"><span class="prog-label">剩余时间</span><div class="prog-line"><div class="prog-track"><div class="prog-fill" style="--v:70%"></div></div><span class="v">42:10</span></div></div><div class="prog" style="width:auto" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" aria-label="已用次数"><span class="prog-label">已用次数</span><div class="prog-line"><div class="prog-track"><div class="prog-fill" style="--v:35%"></div></div><span class="v">7/20</span></div></div><button class="pill pill--sm" type="button" style="margin-top:auto;align-self:flex-start"><span class="lbl">查看记录</span></button></div>
  </div></div>
</div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
