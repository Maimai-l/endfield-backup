<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Switch</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="row"><span class="row-label">变体</span><div class="items">
        <label class="switch"><input type="checkbox" role="switch"><span class="track"></span>自动降速</label>
        <label class="switch"><input type="checkbox" role="switch" checked=""><span class="track"></span>异常告警</label>
        <label class="switch switch--lg"><input type="checkbox" role="switch" checked=""><span class="track"></span>lg 宽 40、高 22</label>
      </div></div>
      <div class="row"><span class="row-label">状态</span><div class="items">
        <label class="switch is-hover"><input type="checkbox" role="switch"><span class="track"></span>悬停</label>
        <label class="switch is-focus"><input type="checkbox" role="switch" checked=""><span class="track"></span>焦点</label>
        <label class="switch"><input type="checkbox" role="switch" disabled=""><span class="track"></span>禁用</label>
        <label class="switch"><input type="checkbox" role="switch" checked="" disabled=""><span class="track"></span>禁用开启</label>
        <label class="switch is-loading"><input type="checkbox" role="switch" checked="" disabled=""><span class="track"></span>提交中</label>
      </div></div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
