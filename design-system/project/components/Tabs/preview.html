<!-- @dsCard group="导航" height=407 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}</style>
</head>
<body>
<div class="stage">
      <div class="row"><span class="row-label">主标签</span><div class="items" style="width:100%"><div class="mtabs" role="tablist" aria-label="手册" data-tabs="" data-qe="">
        <span class="key" aria-hidden="true">Q</span>
        <button class="mtab" type="button" role="tab" aria-selected="false"><svg class="ic"><use href="#i-doc"></use></svg>节点</button>
        <button class="mtab" type="button" role="tab" aria-selected="true"><svg class="ic"><use href="#i-grid"></use></svg>日常</button>
        <button class="mtab" type="button" role="tab" aria-selected="false"><svg class="ic"><use href="#i-list"></use></svg>索引</button>
        <button class="mtab" type="button" role="tab" aria-selected="false"><svg class="ic"><use href="#i-sliders"></use></svg>训练<span class="badge" aria-label="有新内容"></span></button>
        <span class="key" aria-hidden="true">E</span>
      </div></div></div>
      <div class="row"><span class="row-label">线型</span><div class="items" style="flex-direction:column;align-items:stretch;width:100%">
        <div class="tabs" role="tablist" data-tabs="">
          <button class="tab" type="button" role="tab" aria-selected="true">概览</button>
          <button class="tab" type="button" role="tab" aria-selected="false">运行记录<span class="n">128</span></button>
          <button class="tab" type="button" role="tab" aria-selected="false">告警<span class="n">3</span></button>
          <button class="tab" type="button" role="tab" aria-selected="false">配置</button>
          <button class="tab" type="button" role="tab" aria-selected="false" disabled="">固件（无权限）</button>
        </div>
        <div class="tabs tabs--lg" role="tablist" data-tabs="">
          <button class="tab" type="button" role="tab" aria-selected="false">全部</button>
          <button class="tab" type="button" role="tab" aria-selected="true">进行中</button>
          <button class="tab" type="button" role="tab" aria-selected="false">已关闭</button>
        </div><span class="cap">md 32、lg 40，指示条 2px</span></div></div>
      <div class="row"><span class="row-label">区块</span><div class="items"><div class="btabs" role="tablist" data-tabs="">
        <button class="btab" type="button" role="tab" aria-selected="true">设备档案<span class="arr"><svg class="ic"><use href="#i-chev-r"></use></svg></span></button><span class="div"></span>
        <button class="btab" type="button" role="tab" aria-selected="false">保养计划<span class="arr"><svg class="ic"><use href="#i-chev-r"></use></svg></span></button><span class="div"></span>
        <button class="btab" type="button" role="tab" aria-selected="false">备件库存<span class="arr"><svg class="ic"><use href="#i-chev-r"></use></svg></span></button></div></div></div>
      <div class="row"><span class="row-label">分段</span><div class="items">
        <div class="item"><div class="seg" role="group" aria-label="时间范围" data-seg=""><button type="button" aria-pressed="false">24 小时</button><button type="button" aria-pressed="true">7 天</button><button type="button" aria-pressed="false">30 天</button></div><span class="cap">视图与筛选切换</span></div>
        <div class="item"><div class="seg" role="group" aria-label="视图" data-seg=""><button type="button" aria-pressed="true" aria-label="列表"><svg class="ic" style="vertical-align:-3px"><use href="#i-list"></use></svg></button><button type="button" aria-pressed="false" aria-label="网格"><svg class="ic" style="vertical-align:-3px"><use href="#i-grid"></use></svg></button></div><span class="cap">图标分段</span></div>
      </div></div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
