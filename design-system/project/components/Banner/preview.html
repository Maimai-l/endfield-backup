<!-- @dsCard group="反馈与提示" height=407 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Banner</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}body{padding-top:32px}.prov{position:absolute;top:12px;right:16px;z-index:5;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-checked);color:var(--color-on-checked);font:12px/1 var(--font-medium)}</style>
</head>
<body>
<span class="prov">新增</span>
<div class="stage">
      <div class="alerts">
        <div class="alert alert--info" role="status"><svg class="ic"><use href="#s-info"></use></svg><div class="alert-title">今晚 22:00 至 23:30 进行系统维护</div><button class="x" type="button" aria-label="关闭"><svg class="ic ic--close"><use href="#i-close"></use></svg></button><div class="alert-body">维护期间数据只读，请在此之前保存未提交的内容。</div></div>
        <div class="alert alert--success" role="status"><svg class="ic"><use href="#s-success"></use></svg><div class="alert-title">版本已更新至 4.2.1</div><div class="alert-body">共 18 个项目，全部完成迁移。</div></div>
        <div class="alert alert--warning" role="status"><svg class="ic"><use href="#s-warning"></use></svg><div class="alert-title">存储用量已超过 85%</div><div class="alert-body">建议清理过期文件。<a class="link" href="#c-alert">查看用量</a></div></div>
        <div class="alert alert--error" role="alert"><svg class="ic"><use href="#s-error"></use></svg><div class="alert-title">同步服务中断</div><div class="alert-body">最后一次同步为 14:02，6 个项目的数据已停止更新。</div></div>
      </div>
    </div>
<script>window.Endfield&&Endfield.init(document)</script>
</body>
</html>
