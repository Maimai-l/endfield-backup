<!-- @dsCard group="基础" height=720 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Surface</title>
<style>body{margin:0;background:var(--color-bg-page);color:var(--color-text-primary);font:14px/1.6 var(--font-body)}.stage{border:0;border-radius:0}.stage::before,.stage::after{display:none}body{padding-top:32px}.prov{position:absolute;top:12px;right:16px;z-index:5;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-checked);color:var(--color-on-checked);font:12px/1 var(--font-medium)}
.sf{width:100%}
.sf-hero{height:320px}
.sf-copy{position:absolute;left:32px;top:32px;bottom:32px;width:min(296px,calc(100% - 64px));display:flex;flex-direction:column;align-items:flex-start}
.sf-eyebrow{font:12px/16px var(--font-en);letter-spacing:.12em;text-transform:uppercase}
.sf-title{margin:12px 0 0;font:28px/36px var(--font-bold)}
.sf-text{margin:12px 0 0;font:14px/22px var(--font-body);color:var(--color-text-secondary)}
.sf-copy .prog{width:100%;margin-top:24px}
.sf-acts{display:flex;gap:16px;margin-top:auto}
.sf-arch{height:296px;overflow:hidden}.sf-row:last-child{border-bottom:0}
.sf-rows{position:absolute;left:32px;right:32px;top:56px;display:flex;flex-direction:column}
.sf-row{display:flex;align-items:center;height:48px;border-bottom:1px solid var(--color-border-subtle);gap:32px}
.sf-row:last-child{border-bottom:0}
.sf-row .id{flex:none;width:96px;font:12px/1 var(--font-numeric);letter-spacing:.08em;color:var(--color-text-secondary)}
.sf-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-row .d{flex:none;font:12px/1 var(--font-numeric);color:var(--color-text-secondary)}
.sf-bar{position:absolute;left:0;right:0;top:0;height:56px;border-radius:0;display:flex;align-items:center;gap:32px;padding:0 32px}
.sf-bar b{flex:none;width:96px;font:16px/24px var(--font-medium)}
.sf-bar span{position:relative;font:14px/56px var(--font-body);color:var(--color-text-secondary);white-space:nowrap}
.sf-bar span[aria-current]{color:var(--color-text-primary)}
.sf-bar span[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--y-300)}
@container (max-width:480px){.sf-bar b{width:auto}.sf-bar{gap:24px}.sf-row .id{display:none}}
.sf-arch{container-type:inline-size}
</style>
</head>
<body>
<span class="prov">新增</span>
<div class="stage">
  <div class="row"><span class="row-label">黄色整面</span><div class="items">
    <div class="sf surf surf--brand surf--contour sf-hero">
      <span class="surf-num" aria-hidden="true">04</span>
      <div class="sf-copy">
        <span class="sf-eyebrow">Q4 RELEASE</span>
        <h2 class="sf-title">第四季度版本</h2>
        <p class="sf-text">合并 18 个项目，统一权限与导出格式。</p>
        <div class="prog" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="发布进度"><div class="prog-top"><span>发布进度</span><span class="v">72%</span></div><div class="prog-track"><div class="prog-fill" style="--v:72%"></div></div></div>
        <div class="sf-acts"><button class="btn btn--primary" type="button"><span class="lbl">查看详情</span></button></div>
      </div>
    </div>
  </div></div>
  <div class="row"><span class="row-label">墨色整面</span><div class="items">
    <div class="sf surf surf--ink sf-arch">
      <div class="sf-rows">
        <div class="sf-row"><span class="id">PRJ-0430</span><span class="t">接口限流策略</span><span class="d">2026.09.30</span></div>
        <div class="sf-row"><span class="id">PRJ-0412</span><span class="t">权限模型重构</span><span class="d">2026.09.28</span></div>
        <div class="sf-row"><span class="id">PRJ-0398</span><span class="t">数据导出格式统一</span><span class="d">2026.09.14</span></div>
        <div class="sf-row"><span class="id">PRJ-0371</span><span class="t">成员邀请流程</span><span class="d">2026.08.30</span></div>
        <div class="sf-row"><span class="id">PRJ-0355</span><span class="t">通知中心</span><span class="d">2026.08.11</span></div>
      </div>
      <nav class="glass sf-bar"><b>归档</b><span aria-current="page">全部</span><span>本季度</span><span>已关闭</span></nav>
    </div>
  </div></div>
</div>
</body>
</html>
