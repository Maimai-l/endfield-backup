<title>Linear 风格文件转换</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* 布局：外层底色上一条 232px 侧栏，右侧主面板内嵌 8px 并带圆角边框。
   主面板自上而下为标题栏、属性工具栏、按类型分组的文件列表。 */
:root{
  --bg:#f4f5f7;--panel:#ffffff;--panel-2:#f9fafb;--line:#e6e8eb;--line-2:#d6d9de;
  --text:#1c1d1f;--text-2:#5c6069;--text-3:#8b8f97;
  --hover:#f0f1f3;--active:#e8eaee;
  --accent:#5e6ad2;--accent-2:#4f5bc4;--on-accent:#ffffff;--accent-soft:#eceefb;
  --danger:#d64545;--kbd:#eef0f2;
  --pop-shadow:0 0 0 1px rgba(16,18,24,.06),0 8px 24px rgba(16,18,24,.10);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08090a;--panel:#0f1011;--panel-2:#131416;--line:#1e2024;--line-2:#2a2d33;
  --text:#f2f3f4;--text-2:#a2a6ad;--text-3:#6c7078;
  --hover:#17181b;--active:#1d1f23;
  --accent:#6e79d6;--accent-2:#7d88e0;--on-accent:#ffffff;--accent-soft:#1c1e33;
  --danger:#eb5c5c;--kbd:#1d1f23;
  --pop-shadow:0 0 0 1px rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090a;--panel:#0f1011;--panel-2:#131416;--line:#1e2024;--line-2:#2a2d33;
  --text:#f2f3f4;--text-2:#a2a6ad;--text-3:#6c7078;
  --hover:#17181b;--active:#1d1f23;
  --accent:#6e79d6;--accent-2:#7d88e0;--on-accent:#ffffff;--accent-soft:#1c1e33;
  --danger:#eb5c5c;--kbd:#1d1f23;
  --pop-shadow:0 0 0 1px rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--font);letter-spacing:-.003em;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:14px;height:14px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:2px;padding:10px 8px;min-width:0}
.ws{display:flex;align-items:center;height:32px;padding:0 8px;margin-bottom:10px;font-weight:600;letter-spacing:-.01em}
.side-label{padding:12px 8px 4px;font-size:12px;font-weight:500;color:var(--text-3)}
.nav{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--text-2);text-align:left;cursor:pointer}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current="true"]{background:var(--active);color:var(--text);font-weight:500}
.nav .n{margin-left:auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* 主面板 */
.main{position:relative;display:flex;flex-direction:column;min-width:0;margin:8px 8px 8px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:14px;font-weight:500;letter-spacing:-.01em}
.view-pick{display:none;align-items:center;gap:4px;height:28px;margin-left:-8px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:14px;font-weight:500;cursor:pointer}
.view-pick:hover{background:var(--hover)}
.view-pick .ic{width:12px;height:12px;color:var(--text-3)}
.bar .count{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-2)}
.btn-ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn-ghost:hover:not(:disabled){color:var(--text)}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--kbd);color:var(--text-3);font:500 11px/1 var(--font)}
.btn-primary kbd{background:rgba(255,255,255,.18);color:var(--on-accent)}

/* 属性工具栏 */
.props{display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.props::-webkit-scrollbar{display:none}
.props .div{flex:none;width:1px;height:16px;margin:0 6px;background:var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text-2);cursor:pointer;white-space:nowrap}
.chip:hover:not(:disabled){border-color:var(--line-2);color:var(--text)}
.chip b{font-weight:500;color:var(--text)}
.chip:disabled{opacity:.4;cursor:default}
.chip .ic{width:12px;height:12px;color:var(--text-3)}
.chip.is-on{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.is-on b{color:var(--accent)}
.chip[data-toggle] .ic{width:14px;height:14px}
.chip.is-on .ic{color:var(--accent)}

/* 弹出菜单 */
.pop{position:fixed;z-index:30;min-width:180px;padding:4px;border-radius:8px;background:var(--panel);box-shadow:var(--pop-shadow)}
.pop-title{padding:6px 8px 4px;font-size:12px;color:var(--text-3)}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:0;border-radius:5px;background:none;text-align:left;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--hover);outline:none}
.opt .hint{margin-left:auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.opt .ic{color:var(--accent);visibility:hidden}
.opt[aria-checked="true"] .ic{visibility:visible}

/* 列表 */
.body{position:relative;flex:1;min-height:0;overflow:auto}
.notice{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--text-2)}
.group{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;font-weight:500;color:var(--text-2)}
.group .n{color:var(--text-3);font-weight:400}
.row{display:grid;grid-template-columns:16px 20px minmax(0,1fr) 72px 128px 64px 60px;align-items:center;gap:12px;height:44px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.thumb{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;overflow:hidden;background:var(--active);color:var(--text-3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ic{width:12px;height:12px}
.name{display:flex;align-items:baseline;gap:10px;min-width:0}
.name b{overflow:hidden;font-weight:500;white-space:nowrap;text-overflow:ellipsis}
.name span{flex:none;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.name .err{flex:1 1 auto;overflow:hidden;color:var(--danger);white-space:nowrap;text-overflow:ellipsis}
.sz{font-size:12px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tgt{display:grid;grid-template-columns:48px 12px 48px;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.tgt .from{text-align:right}
.tgt .ic{width:12px;height:12px;color:var(--text-3)}
.tgt b{font-weight:500;color:var(--text)}
.acts{display:flex;gap:2px;justify-content:flex-end}
.act{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--text-3);cursor:pointer;opacity:0}
.row:hover .act,.act:focus-visible{opacity:1}
.act:hover:not(:disabled){background:var(--active);color:var(--text)}
.act:disabled{cursor:default}
.row:hover .act:disabled{opacity:.3}
.st{width:14px;height:14px}
.st-spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* 空状态与拖放 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;min-height:320px;padding:40px 24px;text-align:center}
.empty .icon{display:grid;place-items:center;width:40px;height:40px;margin-bottom:10px;border:1px solid var(--line-2);border-radius:10px;color:var(--text-3)}
.empty .icon .ic{width:20px;height:20px}
.empty h2{margin:0;font-size:14px;font-weight:500}
.empty p{margin:0 0 14px;max-width:420px;color:var(--text-3)}
.drop{position:absolute;inset:8px;z-index:20;display:grid;place-items:center;border:1px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,var(--accent));color:var(--accent);font-weight:500;pointer-events:none}

/* 轻提示 */
.toast{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:10px 14px;border-radius:8px;background:var(--panel);box-shadow:var(--pop-shadow);font-weight:500}
.toast .ic{color:var(--accent)}
.toast.is-err .ic{color:var(--danger)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{margin:0;border:0;border-radius:0}
  .bar{padding:0 8px 0 16px}
  .bar .hide-sm{display:none}
  .props{padding:8px 16px}
  .bar h1{display:none}
  .view-pick{display:inline-flex}
  .group{padding:0 16px}
  .row{grid-template-columns:16px 20px minmax(0,1fr) auto auto;gap:10px;height:auto;min-height:52px;padding:8px 8px 8px 16px}
  .row .sz{display:none}
  .name{flex-direction:column;align-items:flex-start;gap:0}
  .name b{max-width:100%}
  .name .err{max-width:100%}
  .tgt{grid-template-columns:auto 12px auto;gap:4px}
  .acts{gap:0}
  .act{opacity:1}
  .act:disabled{opacity:.3}
}
@media (prefers-reduced-motion:reduce){.st-spin{animation-duration:3s}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M4.5 6.5 8 10l3.5-3.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></symbol>
  <symbol id="i-box" viewBox="0 0 16 16"><rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2.5"/></symbol>
  <symbol id="i-box-on" viewBox="0 0 16 16"><rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2.5" fill="currentColor"/><path d="M5.5 8.25 7.25 10 10.5 6.25" stroke="var(--panel)"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-save" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></symbol>
  <symbol id="i-to" viewBox="0 0 16 16"><path d="M3 8h9.5M9 4.5 12.5 8 9 11.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2"/><circle cx="6" cy="6.5" r="1"/><path d="m3 11.5 3-3 2.5 2.5 2-2 2.5 2.5"/></symbol>
  <symbol id="i-table" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M2.5 9.75h11M6.5 6.5V13"/></symbol>
  <symbol id="i-files" viewBox="0 0 16 16"><path d="M5 2.5h4.5L13 6v6.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M9.5 2.5V6H13"/></symbol>
  <symbol id="i-upload" viewBox="0 0 16 16"><path d="M8 10.5v-8M4.5 6 8 2.5 11.5 6M3 13.5h10"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 7.5v3M8 5.25v.01"/></symbol>
  <symbol id="s-wait" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.2 2.2"/></symbol>
  <symbol id="s-done" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M4.4 7.2 6.2 9 9.7 5.2" fill="none" stroke="var(--panel)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="s-fail" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M5 5l4 4M9 5 5 9" fill="none" stroke="var(--panel)" stroke-width="1.5" stroke-linecap="round"/></symbol>
</svg>

<div class="app">
  <aside class="side" aria-label="视图">
    <div class="ws">文件工具</div>
    <button class="nav" type="button" data-view="all" aria-current="true"><svg class="ic"><use href="#i-files"/></svg>全部文件<span class="n" data-count="all"></span></button>
    <button class="nav" type="button" data-view="wait"><svg class="st" style="color:var(--text-3)"><use href="#s-wait"/></svg>待转换<span class="n" data-count="wait"></span></button>
    <button class="nav" type="button" data-view="done"><svg class="st" style="color:var(--accent)"><use href="#s-done"/></svg>已完成<span class="n" data-count="done"></span></button>
    <button class="nav" type="button" data-view="fail"><svg class="st" style="color:var(--danger)"><use href="#s-fail"/></svg>失败<span class="n" data-count="fail"></span></button>
  </aside>

  <main class="main" id="main">
    <header class="bar">
      <h1 id="view-title">全部文件</h1>
      <button class="view-pick" type="button" id="view-pick" data-menu="view" aria-haspopup="menu"><span id="view-pick-t">全部文件</span><svg class="ic"><use href="#i-down"/></svg></button>
      <span class="count" id="view-count"></span>
      <span class="sp"></span>
      <button class="btn btn-ghost hide-sm" type="button" id="b-zip" disabled><svg class="ic"><use href="#i-save"/></svg>全部保存</button>
      <button class="btn" type="button" id="b-add"><svg class="ic"><use href="#i-plus"/></svg>添加文件<kbd class="hide-sm">U</kbd></button>
      <button class="btn btn-primary" type="button" id="b-run" disabled>转换<kbd class="hide-sm">R</kbd></button>
      <input type="file" id="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.bmp,.svg,.xlsx,.xls,.csv,.tsv,.json" hidden>
    </header>

    <div class="props" role="toolbar" aria-label="输出设置">
      <button class="chip" type="button" data-menu="img"><svg class="ic"><use href="#i-image"/></svg>图片<b data-v="img"></b><svg class="ic"><use href="#i-down"/></svg></button>
      <button class="chip" type="button" data-menu="q">质量<b data-v="q"></b><svg class="ic"><use href="#i-down"/></svg></button>
      <button class="chip" type="button" data-menu="max">尺寸<b data-v="max"></b><svg class="ic"><use href="#i-down"/></svg></button>
      <span class="div" aria-hidden="true"></span>
      <button class="chip" type="button" data-menu="tbl"><svg class="ic"><use href="#i-table"/></svg>表格<b data-v="tbl"></b><svg class="ic"><use href="#i-down"/></svg></button>
      <button class="chip" type="button" data-toggle="bom" aria-pressed="true"><svg class="ic"><use href="#i-box"/></svg>CSV 包含 BOM</button>
      <button class="chip" type="button" data-toggle="head" aria-pressed="true"><svg class="ic"><use href="#i-box"/></svg>首行作为字段名</button>
    </div>

    <div class="notice" id="no-dl" hidden><svg class="ic ic-sm"><use href="#i-info"/></svg>当前环境无法保存文件。在 claude.ai 中打开此页面后可保存转换结果。</div>

    <div class="body" id="body">
      <div class="empty" id="empty">
        <span class="icon"><svg class="ic"><use href="#i-upload"/></svg></span>
        <h2>拖入文件开始转换</h2>
        <p>PNG、JPEG、WebP、GIF、BMP、SVG 转为图片格式；XLSX、XLS、CSV、TSV、JSON 互相转换。</p>
        <button class="btn" type="button" id="b-pick"><svg class="ic"><use href="#i-plus"/></svg>选择文件<kbd>U</kbd></button>
      </div>
      <div id="list" role="list"></div>
    </div>

    <div class="drop" id="drop" hidden>松开以添加文件</div>
  </main>
</div>

<div class="pop" id="pop" role="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var IMG=['png','jpg','jpeg','webp','gif','bmp','svg'],TBL=['xlsx','xls','csv','tsv','json'];
var MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',csv:'text/csv',json:'application/json'};
var MENUS={
  img:{title:'图片输出格式',opts:[['png','PNG','无损'],['jpeg','JPEG',''],['webp','WebP','']]},
  q:{title:'图片质量',opts:[[0.95,'高','0.95'],[0.85,'标准','0.85'],[0.7,'低','0.70']]},
  max:{title:'图片尺寸',opts:[[0,'原尺寸',''],[2048,'长边 2048','px'],[1280,'长边 1280','px'],[640,'长边 640','px']]},
  view:{title:'视图',opts:[]},
  tbl:{title:'表格输出格式',opts:[['xlsx','XLSX','全部工作表'],['csv','CSV','首个工作表'],['json','JSON','首个工作表']]}
};
var S={img:'jpeg',q:0.85,max:0,tbl:'xlsx',bom:true,head:true};
var Q=[],seq=0,busy=false,view='all',DL=null;
var VIEWS={all:'全部文件',wait:'待转换',done:'已完成',fail:'失败'};

function ext(n){var m=/\.([^.]+)$/.exec(n);return m?m[1].toLowerCase():''}
function base(n){return n.replace(/\.[^.]+$/,'')}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function label(key,v){var o=MENUS[key].opts.find(function(x){return x[0]===v});return o?o[1]:''}
function outLabel(it){return it.kind==='image'?label('img',S.img):label('tbl',S.tbl)}

/* 轻提示 */
var tt;
function toast(msg,err){var t=$('toast');t.className='toast'+(err?' is-err':'');t.innerHTML='<svg class="ic"><use href="#'+(err?'i-info':'i-check')+'"/></svg><span></span>';t.lastChild.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3200)}

/* 保存能力 */
(window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)).then(function(d){DL=d;$('no-dl').hidden=!!d;render()},function(){$('no-dl').hidden=false});

/* 添加文件 */
function add(files){
  var bad=[];
  [].forEach.call(files,function(f){
    var e=ext(f.name),kind=IMG.indexOf(e)>=0?'image':TBL.indexOf(e)>=0?'table':null;
    if(!kind){bad.push(f.name);return}
    Q.push({id:++seq,file:f,name:f.name,ext:e,kind:kind,status:'wait',thumb:kind==='image'?URL.createObjectURL(f):null});
  });
  if(bad.length)toast('不支持的格式：'+bad.join('、'),true);
  render();
}
function pick(){$('file').click()}
$('b-add').addEventListener('click',pick);$('b-pick').addEventListener('click',pick);
$('file').addEventListener('change',function(){add(this.files);this.value=''});
var depth=0,main=$('main');
main.addEventListener('dragenter',function(e){e.preventDefault();depth++;$('drop').hidden=false});
main.addEventListener('dragover',function(e){e.preventDefault()});
main.addEventListener('dragleave',function(){if(--depth<=0){depth=0;$('drop').hidden=true}});
main.addEventListener('drop',function(e){e.preventDefault();depth=0;$('drop').hidden=true;if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});

/* 输出设置：属性标签与弹出菜单 */
var pop=$('pop'),popFor=null;
function closePop(){pop.hidden=true;if(popFor)popFor.setAttribute('aria-expanded','false');popFor=null}
function openPop(chip){
  var key=chip.dataset.menu,m=MENUS[key],cur=key==='view'?view:S[key];
  if(key==='view')m.opts=Object.keys(VIEWS).map(function(k){return [k,VIEWS[k],String(counts()[k]||'')]});
  pop.innerHTML='<div class="pop-title">'+m.title+'</div>'+m.opts.map(function(o){
    return '<button class="opt" type="button" role="menuitemradio" aria-checked="'+(cur===o[0])+'" data-v="'+o[0]+'"><svg class="ic"><use href="#i-check"/></svg>'+o[1]+(o[2]?'<span class="hint">'+o[2]+'</span>':'')+'</button>';
  }).join('');
  pop.hidden=false;var r=chip.getBoundingClientRect(),w=pop.offsetWidth;
  pop.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';pop.style.top=(r.bottom+6)+'px';
  popFor=chip;chip.setAttribute('aria-expanded','true');
  (pop.querySelector('[aria-checked="true"]')||pop.querySelector('.opt')).focus();
  pop.onclick=function(e){var b=e.target.closest('.opt');if(!b)return;var v=b.dataset.v;if(key==='view'){view=v;render()}else set(key,typeof S[key]==='number'?+v:v);closePop();chip.focus()};
}
pop.addEventListener('keydown',function(e){
  var items=[].slice.call(pop.querySelectorAll('.opt')),i=items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
  if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
  if(e.key==='Escape'){var c=popFor;closePop();if(c)c.focus()}
});
$('view-pick').addEventListener('click',function(){var c=this;if(popFor===c)closePop();else{closePop();openPop(c)}});
document.addEventListener('mousedown',function(e){if(!pop.hidden&&!pop.contains(e.target)&&e.target.closest('[data-menu]')!==popFor)closePop()});
addEventListener('resize',closePop);$('body').addEventListener('scroll',closePop);
document.querySelector('.props').addEventListener('click',function(e){
  var c=e.target.closest('[data-menu]');if(c){if(popFor===c)closePop();else{closePop();openPop(c)}return}
  var t=e.target.closest('[data-toggle]');if(t)set(t.dataset.toggle,!S[t.dataset.toggle]);
});
function set(key,v){
  if(S[key]===v)return;S[key]=v;
  var kind=key==='img'||key==='q'||key==='max'?'image':'table';
  Q.forEach(function(it){if(it.kind===kind&&it.status!=='busy'&&it.status!=='wait'){it.status='wait';it.out=null;it.err=null}});
  render();
}

/* 转换 */
function loadImg(url){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=function(){no(new Error('图片无法读取'))};i.src=url})}
async function convImage(it){
  var src;
  if(it.ext==='svg')src=await loadImg(it.thumb);else{try{src=await createImageBitmap(it.file)}catch(e){src=await loadImg(it.thumb)}}
  var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(!w||!h)throw new Error('图片尺寸为 0');
  if(S.max&&Math.max(w,h)>S.max){var k=S.max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  if(S.img==='jpeg'){x.fillStyle='#ffffff';x.fillRect(0,0,w,h)}
  x.drawImage(src,0,0,w,h);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/'+S.img,S.q)});
  if(!blob||blob.type!=='image/'+S.img)throw new Error('当前浏览器不能导出 '+label('img',S.img));
  var oe=S.img==='jpeg'?'jpg':S.img,same=oe===it.ext||(oe==='jpg'&&it.ext==='jpeg');
  return {blob:blob,name:base(it.name)+(same?'-converted':'')+'.'+oe,label:label('img',S.img),note:'宽 '+w+'，高 '+h};
}
async function readBook(it){
  if(typeof XLSX==='undefined')throw new Error('表格解析库未能加载');
  if(it.ext==='json'){
    var d;try{d=JSON.parse(await it.file.text())}catch(e){throw new Error('JSON 格式有误')}
    var ws;if(Array.isArray(d)&&d.length&&Array.isArray(d[0]))ws=XLSX.utils.aoa_to_sheet(d);
    else if(Array.isArray(d))ws=XLSX.utils.json_to_sheet(d);
    else if(d&&typeof d==='object')ws=XLSX.utils.json_to_sheet([d]);
    else throw new Error('JSON 顶层须为数组或对象');
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');return wb;
  }
  if(it.ext==='csv'||it.ext==='tsv'){var t=await it.file.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);return XLSX.read(t,{type:'string',raw:true,FS:it.ext==='tsv'?'\t':undefined})}
  return XLSX.read(await it.file.arrayBuffer(),{type:'array'});
}
async function convTable(it){
  var wb=await readBook(it),first=wb.SheetNames[0];if(!first)throw new Error('文件中没有工作表');
  var ws=wb.Sheets[first],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).length,blob,note;
  if(S.tbl==='xlsx'){blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:MIME.xlsx});note=wb.SheetNames.length+' 个工作表'}
  else{
    var text=S.tbl==='csv'?(S.bom?'﻿':'')+XLSX.utils.sheet_to_csv(ws):JSON.stringify(S.head?XLSX.utils.sheet_to_json(ws,{defval:''}):XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),null,2);
    blob=new Blob([text],{type:MIME[S.tbl]});note=rows+' 行';
  }
  return {blob:blob,name:base(it.name)+(S.tbl===it.ext?'-converted':'')+'.'+S.tbl,label:label('tbl',S.tbl),note:note};
}
async function run(){
  if(busy)return;var todo=Q.filter(function(it){return it.status==='wait'||it.status==='fail'});if(!todo.length)return;
  busy=true;var ok=0,fail=0;
  for(var i=0;i<todo.length;i++){var it=todo[i];if(Q.indexOf(it)<0)continue;it.status='busy';it.err=null;render();
    try{it.out=it.kind==='image'?await convImage(it):await convTable(it);it.status='done';ok++}catch(e){it.status='fail';it.err=e.message||'转换失败';fail++}
    render();}
  busy=false;render();
  toast(fail?ok+' 个已转换，'+fail+' 个失败':ok+' 个文件已转换',!!fail);
}
$('b-run').addEventListener('click',run);

/* 保存与打包 */
function saveErr(e){if(!e||e.code==='declined')return;toast(e.code==='rate_limited'?'请先处理当前的保存确认':'保存失败',true)}
function save(it){if(!DL||!it.out)return;DL.save({filename:it.out.name,data:it.out.blob}).then(function(){toast('已保存 '+it.out.name)},saveErr)}
$('b-zip').addEventListener('click',async function(){
  var done=Q.filter(function(it){return it.status==='done'});if(!DL||done.length<2||typeof JSZip==='undefined')return;
  var zip=new JSZip(),used={};
  done.forEach(function(it){var n=it.out.name,k=1;while(used[n])n=base(it.out.name)+'-'+(++k)+'.'+ext(it.out.name);used[n]=1;zip.file(n,it.out.blob)});
  var blob=await zip.generateAsync({type:'blob'});
  DL.save({filename:'converted-'+new Date().toISOString().slice(0,10)+'.zip',data:blob}).then(function(){toast('已保存 '+done.length+' 个文件')},saveErr);
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var it=Q.find(function(x){return x.id===+b.closest('.row').dataset.id});if(!it)return;
  if(b.dataset.act==='save')save(it);
  if(b.dataset.act==='rm'&&it.status!=='busy'){if(it.thumb)URL.revokeObjectURL(it.thumb);Q.splice(Q.indexOf(it),1);render()}
});

/* 视图 */
document.querySelector('.side').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;render()});
function inView(it){return view==='all'||(view==='wait'?(it.status==='wait'||it.status==='busy'):it.status===view)}

/* 快捷键 */
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||!pop.hidden)return;
  if(e.key==='u'||e.key==='U'){e.preventDefault();pick()}
  if(e.key==='r'||e.key==='R'){e.preventDefault();run()}
});

/* 渲染 */
function statusIcon(it){
  if(it.status==='busy')return '<svg class="st st-spin" viewBox="0 0 14 14" style="color:var(--accent)" aria-label="转换中"><circle cx="7" cy="7" r="5.25" fill="none" stroke="var(--line-2)" stroke-width="1.5"/><path d="M7 1.75a5.25 5.25 0 0 1 5.25 5.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  if(it.status==='done')return '<svg class="st" style="color:var(--accent)" aria-label="已完成"><use href="#s-done"/></svg>';
  if(it.status==='fail')return '<svg class="st" style="color:var(--danger)" aria-label="失败"><use href="#s-fail"/></svg>';
  return '<svg class="st" style="color:var(--text-3)" aria-label="待转换"><use href="#s-wait"/></svg>';
}
function row(it){
  var thumb=it.thumb?'<img src="'+it.thumb+'" alt="">':'<svg class="ic"><use href="#i-table"/></svg>';
  var sub=it.status==='fail'?'<span class="err">'+esc(it.err)+'</span>':it.out?'<span>'+esc(it.out.note)+'</span>':'';
  return '<div class="row" role="listitem" data-id="'+it.id+'">'+statusIcon(it)+'<span class="thumb">'+thumb+'</span>'+
    '<div class="name"><b title="'+esc(it.name)+'">'+esc(it.name)+'</b>'+sub+'</div>'+
    '<span class="sz">'+size(it.file.size)+'</span>'+
    '<span class="tgt"><span class="from">'+it.ext.toUpperCase()+'</span><svg class="ic"><use href="#i-to"/></svg><b>'+(it.out?it.out.label:outLabel(it))+'</b></span>'+
    '<span class="sz">'+(it.out?size(it.out.blob.size):'')+'</span>'+
    '<span class="acts"><button class="act" type="button" data-act="save" aria-label="保存 '+esc(it.name)+'"'+(it.status==='done'&&DL?'':' disabled')+'><svg class="ic"><use href="#i-save"/></svg></button>'+
    '<button class="act" type="button" data-act="rm" aria-label="移除 '+esc(it.name)+'"'+(it.status==='busy'?' disabled':'')+'><svg class="ic"><use href="#i-x"/></svg></button></span></div>';
}
function counts(){var c={all:Q.length,wait:0,done:0,fail:0};Q.forEach(function(it){c[it.status==='busy'?'wait':it.status]++});return c}
function render(){
  var shown=Q.filter(inView),groups=[['image','图片'],['table','表格']];
  $('list').innerHTML=groups.map(function(g){
    var items=shown.filter(function(it){return it.kind===g[0]});if(!items.length)return '';
    return '<div class="group"><svg class="ic ic-sm"><use href="#'+(g[0]==='image'?'i-image':'i-table')+'"/></svg>'+g[1]+'<span class="n">'+items.length+'</span></div>'+items.map(row).join('');
  }).join('');
  $('empty').hidden=Q.length>0;
  if(Q.length&&!shown.length)$('list').innerHTML='<div class="empty"><h2>没有'+VIEWS[view]+'的文件</h2></div>';
  var c=counts();
  document.querySelectorAll('[data-count]').forEach(function(n){var v=c[n.dataset.count];n.textContent=v||''});
  document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-current',String(b.dataset.view===view))});
  $('view-title').textContent=$('view-pick-t').textContent=VIEWS[view];$('view-count').textContent=shown.length||'';
  $('b-run').disabled=busy||!c.wait&&!c.fail;$('b-zip').disabled=busy||c.done<2||!DL;
  document.querySelectorAll('[data-v]').forEach(function(b){if(b.tagName==='B')b.textContent=label(b.dataset.v,S[b.dataset.v])});
  document.querySelector('[data-menu="q"]').disabled=S.img==='png';
  var bom=document.querySelector('[data-toggle="bom"]'),head=document.querySelector('[data-toggle="head"]');
  bom.hidden=S.tbl!=='csv';head.hidden=S.tbl!=='json';
  bom.classList.toggle('is-on',S.bom);bom.querySelector('use').setAttribute('href',S.bom?'#i-box-on':'#i-box');bom.setAttribute('aria-pressed',String(S.bom));
  head.classList.toggle('is-on',S.head);head.querySelector('use').setAttribute('href',S.head?'#i-box-on':'#i-box');head.setAttribute('aria-pressed',String(S.head));
}
render();
})();
</script>
