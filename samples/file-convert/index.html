<title>ENDFIELD 文件转换</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<style>
/* 单页工具：顶栏 + 居中工作区（最大宽 1120）。颜色、字体、间距、控件全部取自 ENDFIELD tokens 与 bundle.css。
   工作页间距：页边距与区块之间 space-6；同级组件 space-4；元素内 space-2。 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tex-invert:1;color-scheme:dark}}
[hidden]{display:none!important}
body{background:var(--color-bg-page);color:var(--color-text-primary)}
.fc-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-sticky)}
.fc-top .title{flex-direction:row;align-items:center;gap:var(--space-4)}
.fc-mark{display:block;flex:none;width:120px;height:auto}
.fc-mark path{fill:var(--color-text-primary)}
.fc-top .vsep{height:20px}
.fc-page{display:flex;flex-direction:column;gap:var(--space-6);width:100%;max-width:1120px;margin:0 auto;padding:var(--space-6)}
.fc-drop{width:100%;padding:var(--space-7) var(--space-5);transition:border-color var(--duration-base) ease,background-color var(--duration-base) ease}
.fc-drop.is-over{border-color:var(--color-border-strong);background-color:var(--color-state-hover)}
.fc-drop p{max-width:44em}
.fc-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.fc-panel{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);background:var(--color-bg-surface);min-width:0}
.fc-panel-h{display:flex;flex-direction:column;gap:var(--space-1)}
.fc-panel-h h2{margin:0;font:16px/1.4 var(--font-medium);font-weight:400}
.fc-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.fc-opts{display:flex;flex-direction:column;gap:var(--space-2)}
.fc-queue{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.fc-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--space-2) var(--space-4)}
.fc-head h2{margin:0;font:18px/1.3 var(--font-medium);font-weight:400}
.fc-head .sum{font-size:13px;color:var(--color-text-secondary)}
.fc-file{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.fc-thumb{flex:none;display:grid;place-items:center;width:32px;height:32px;overflow:hidden;border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text-tertiary)}
.fc-thumb img{width:100%;height:100%;object-fit:cover}
.fc-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.fc-name b{display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-medium);font-weight:400}
.fc-name b span{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-sub{font-size:12px;color:var(--color-text-tertiary)}
.fc-err{font-size:12px;color:var(--color-error-text)}
.fc-busy{display:inline-flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--color-text-secondary)}
.fc-ops{display:flex;justify-content:flex-end;gap:var(--space-2)}
.fc-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-2)}
.fc-queue .dt td{white-space:nowrap}
@media (max-width:760px){
  .fc-settings,.fc-row{grid-template-columns:minmax(0,1fr)}
  .fc-page{padding:var(--space-4)}
  .fc-queue .dt th:nth-child(2),.fc-queue .dt td:nth-child(2),.fc-queue .dt th:nth-child(3),.fc-queue .dt td:nth-child(3){display:none}
}
</style>

<main class="fc-page">
  <div class="alert alert--info" role="status" id="no-dl" hidden><svg class="ic"><use href="#s-info"/></svg><div class="alert-title">这个视图不能保存文件</div><div class="alert-body">转换照常进行，但结果只能在 claude.ai 中打开本页后保存。</div></div>

  <section class="empty fc-drop" id="drop" aria-label="添加文件">
    <span class="empty-ic"><svg class="ic ic--xl"><use href="#i-upload"/></svg></span>
    <h5>拖入文件，或点击选择</h5>
    <p>图片支持 PNG、JPEG、WebP、GIF、BMP、SVG；表格支持 XLSX、XLS、CSV、TSV、JSON。文件只在本页内转换，不会上传。</p>
    <button class="btn btn--secondary" type="button" id="pick"><span class="lbl">选择文件</span></button>
    <input type="file" id="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.bmp,.svg,.xlsx,.xls,.csv,.tsv,.json" hidden>
  </section>

  <section class="fc-settings" id="settings" aria-label="输出设置">
    <div class="fc-panel">
      <div class="fc-panel-h"><span class="card-eyebrow">Image</span><h2>图片输出</h2></div>
      <div class="field"><span class="field-label" id="l-imgfmt">格式</span>
        <div class="seg" role="group" aria-labelledby="l-imgfmt" data-seg id="seg-img"><button type="button" aria-pressed="false" data-v="png">PNG</button><button type="button" aria-pressed="true" data-v="jpeg">JPEG</button><button type="button" aria-pressed="false" data-v="webp">WebP</button></div>
      </div>
      <div class="fc-row">
        <div class="field"><span class="field-label" id="l-q">质量</span>
          <div class="dd" data-dd id="dd-q">
            <button class="input select" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="l-q"><span class="val" data-val>标准（0.85）</span><svg class="ic tri"><use href="#i-tri-d"/></svg></button>
            <div class="menu" role="listbox" hidden>

              <button class="menu-item" type="button" role="option" aria-selected="true" data-v="0.85">标准（0.85）<svg class="ic ok"><use href="#i-check"/></svg></button>
              <button class="menu-item" type="button" role="option" aria-selected="false" data-v="0.7">小文件（0.7）<svg class="ic ok"><use href="#i-check"/></svg></button>
            </div>
          </div>
          <div class="field-help" id="q-help">只对 JPEG 与 WebP 生效</div>
        </div>
        <div class="field"><span class="field-label" id="l-size">尺寸</span>

            <button class="input select" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="l-size"><span class="val" data-val>保持原尺寸</span><svg class="ic tri"><use href="#i-tri-d"/></svg></button>
            <div class="menu" role="listbox" hidden>
              <button class="menu-item" type="button" role="option" aria-selected="true" data-v="0">保持原尺寸<svg class="ic ok"><use href="#i-check"/></svg></button>
              <button class="menu-item" type="button" role="option" aria-selected="false" data-v="2048">长边不超过 2048<svg class="ic ok"><use href="#i-check"/></svg></button>
              <button class="menu-item" type="button" role="option" aria-selected="false" data-v="1280">长边不超过 1280<svg class="ic ok"><use href="#i-check"/></svg></button>
              <button class="menu-item" type="button" role="option" aria-selected="false" data-v="640">长边不超过 640<svg class="ic ok"><use href="#i-check"/></svg></button>
            </div>
          </div>

    <div class="fc-panel">

        <div class="seg" role="group" aria-labelledby="l-tblfmt" data-seg id="seg-tbl"><button type="button" aria-pressed="true" data-v="xlsx">XLSX</button><button type="button" aria-pressed="false" data-v="csv">CSV</button><button type="button" aria-pressed="false" data-v="json">JSON</button></div>

      <div class="fc-opts">
        <label class="check" id="o-bom-l"><input type="checkbox" id="o-bom" checked><span class="box"><svg class="ic tick"><use href="#i-check"/></svg></span>CSV 带 BOM，Excel 打开中文不乱码</label>
        <label class="check" id="o-head-l"><input type="checkbox" id="o-head" checked><span class="box"><svg class="ic tick"><use href="#i-check"/></svg></span>JSON 以第一行作为字段名</label>
      </div>
      <div class="field-help">CSV 与 JSON 只取第一个工作表；XLSX 保留全部工作表。</div>
    </div>

  <section class="fc-queue" aria-labelledby="q-title">
    <div class="fc-head"><h2 id="q-title">转换队列</h2><span class="sum" id="sum" aria-live="polite"></span></div>
    <div class="tbl-wrap" id="q-wrap"><table class="dt">
      <thead><tr><th>文件</th><th>原格式</th><th class="num">大小</th><th>输出</th><th>状态</th><th class="num">操作</th></tr></thead>
      <tbody id="q-rows"></tbody>
    </table></div>
    <p class="fc-sub" id="q-empty" hidden>队列为空。添加文件后在这里转换和保存。</p>
    <div class="fc-foot">
      <button class="btn btn--ghost" type="button" id="b-clear"><span class="lbl">清空队列</span></button>
      <button class="btn btn--secondary" type="button" id="b-zip"><span class="lbl">全部保存为 ZIP</span></button>
      <button class="btn btn--primary" type="button" id="b-run"><span class="lbl">开始转换</span></button>
    </div>
  </section>
</main>

<div class="toast-stack" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="bundle.js"></script>
<script>
(function(){
Endfield.init(document);
var IMG=['png','jpg','jpeg','webp','gif','bmp','svg'],TBL=['xlsx','xls','csv','tsv','json'];
var FMT_LABEL={png:'PNG',jpeg:'JPEG',webp:'WebP',xlsx:'XLSX',csv:'CSV',json:'JSON'};
var MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',csv:'text/csv',json:'application/json'};
var Q=[],seq=0,busy=false,DL,dlReady=false;
var $=function(id){return document.getElementById(id)};
function ext(n){var m=/\.([^.]+)$/.exec(n);return m?m[1].toLowerCase():''}
function base(n){return n.replace(/\.[^.]+$/,'')}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pressed(id){return $(id).querySelector('[aria-pressed="true"]').dataset.v}
function picked(id){return $(id).querySelector('.menu-item[aria-selected="true"]').dataset.v}
function settings(){return {img:pressed('seg-img'),q:+picked('dd-q'),max:+picked('dd-size'),tbl:pressed('seg-tbl'),bom:$('o-bom').checked,head:$('o-head').checked}}

/* 保存：downloads 能力 */
var use=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
use.then(function(d){DL=d;dlReady=true;$('no-dl').hidden=!!d;render()},function(){DL=null;dlReady=true;$('no-dl').hidden=false;render()});

/* 添加文件 */
function add(files,sample){
  var bad=[];
  [].forEach.call(files,function(f){
    var e=ext(f.name),kind=IMG.indexOf(e)>=0?'image':TBL.indexOf(e)>=0?'table':null;
    if(!kind){bad.push(f.name);return}
    Q.push({id:++seq,file:f,name:f.name,ext:e,kind:kind,status:'wait',sample:!!sample,thumb:kind==='image'?URL.createObjectURL(f):null});
  });
  if(bad.length)Endfield.toast('warning','不支持的格式：'+bad.join('、'),'');
  render();
}
$('pick').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(){add(this.files);this.value=''});
var drop=$('drop');
['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('is-over')})});
['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();if(t==='dragleave'&&drop.contains(e.relatedTarget))return;drop.classList.remove('is-over')})});
drop.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});

/* 设置变更：已完成的同类文件回到待转换 */
var last=JSON.stringify(settings());
function onSettings(){
  var s=settings(),now=JSON.stringify(s);
  $('q-help').textContent=s.img==='png'?'PNG 为无损格式，不使用质量设置':'只对 JPEG 与 WebP 生效';
  $('o-bom-l').style.opacity=s.tbl==='csv'?'':'.5';$('o-head-l').style.opacity=s.tbl==='json'?'':'.5';
  if(now===last)return;var p=JSON.parse(last);last=now;
  var imgChanged=p.img!==s.img||p.q!==s.q||p.max!==s.max,tblChanged=p.tbl!==s.tbl||p.bom!==s.bom||p.head!==s.head;
  Q.forEach(function(it){if(it.status!=='busy'&&((it.kind==='image'&&imgChanged)||(it.kind==='table'&&tblChanged))){it.status='wait';it.out=null;it.err=null}});
  render();
}
$('settings').addEventListener('click',function(){setTimeout(onSettings,0)});
$('settings').addEventListener('change',onSettings);

/* 转换 */
function loadImg(url){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=function(){no(new Error('图片无法读取'))};i.src=url})}
async function convImage(it,s){
  var src;
  if(it.ext==='svg')src=await loadImg(it.thumb);else{try{src=await createImageBitmap(it.file)}catch(e){src=await loadImg(it.thumb)}}
  var w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(!w||!h)throw new Error('图片尺寸为 0');
  if(s.max&&Math.max(w,h)>s.max){var k=s.max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  if(s.img==='jpeg'){x.fillStyle='#ffffff';x.fillRect(0,0,w,h)}
  x.drawImage(src,0,0,w,h);
  var blob=await new Promise(function(ok){c.toBlob(ok,'image/'+s.img,s.q)});
  if(!blob||blob.type!=='image/'+s.img)throw new Error('当前浏览器不能导出 '+FMT_LABEL[s.img]);
  var oe=s.img==='jpeg'?'jpg':s.img;
  return {blob:blob,name:base(it.name)+(oe===it.ext||(oe==='jpg'&&it.ext==='jpeg')?'-converted':'')+'.'+oe,label:FMT_LABEL[s.img],note:'宽 '+w+'，高 '+h};
}
async function readBook(it){
  if(typeof XLSX==='undefined')throw new Error('表格组件未加载，请检查网络后刷新');
  if(it.ext==='json'){
    var d;try{d=JSON.parse(await it.file.text())}catch(e){throw new Error('JSON 格式有误')}
    var ws;if(Array.isArray(d)&&d.length&&Array.isArray(d[0]))ws=XLSX.utils.aoa_to_sheet(d);
    else if(Array.isArray(d))ws=XLSX.utils.json_to_sheet(d);
    else if(d&&typeof d==='object')ws=XLSX.utils.json_to_sheet([d]);
    else throw new Error('JSON 需为数组或对象');
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');return wb;
  }
  if(it.ext==='csv'||it.ext==='tsv'){var t=await it.file.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);return XLSX.read(t,{type:'string',raw:true,FS:it.ext==='tsv'?'\t':undefined})}
  return XLSX.read(await it.file.arrayBuffer(),{type:'array'});
}
async function convTable(it,s){
  var wb=await readBook(it),first=wb.SheetNames[0],ws=wb.Sheets[first];
  if(!first)throw new Error('文件中没有工作表');
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).length,blob,note;
  if(s.tbl==='xlsx'){blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:MIME.xlsx});note=wb.SheetNames.length+' 个工作表'}
  else{
    var text=s.tbl==='csv'?(s.bom?'﻿':'')+XLSX.utils.sheet_to_csv(ws):JSON.stringify(s.head?XLSX.utils.sheet_to_json(ws,{defval:''}):XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),null,2);
    blob=new Blob([text],{type:MIME[s.tbl]});
    note=rows+' 行'+(wb.SheetNames.length>1?'，取自工作表 '+first:'');
  }
  return {blob:blob,name:base(it.name)+(s.tbl===it.ext?'-converted':'')+'.'+s.tbl,label:FMT_LABEL[s.tbl],note:note};
}
async function run(){
  if(busy)return;var todo=Q.filter(function(it){return it.status==='wait'||it.status==='fail'});if(!todo.length)return;
  busy=true;var s=settings(),ok=0,fail=0;
  for(var i=0;i<todo.length;i++){var it=todo[i];if(Q.indexOf(it)<0)continue;it.status='busy';it.err=null;render();
    try{it.out=it.kind==='image'?await convImage(it,s):await convTable(it,s);it.status='done';ok++}catch(e){it.status='fail';it.err=e.message||'转换失败';fail++}
    render();}
  busy=false;render();
  if(fail)Endfield.toast('error',ok+' 个文件已转换，'+fail+' 个失败，原因见队列','');else Endfield.toast('success',ok+' 个文件已转换','');
}
$('b-run').addEventListener('click',run);

/* 保存与打包 */
function saveErr(e){if(!e||e.code==='declined')return;if(e.code==='rate_limited')Endfield.toast('warning','已有一个保存确认未处理，请先完成它','');else Endfield.toast('error','保存失败：'+(e.message||e.code),'')}
function save(it){if(!DL||!it.out)return;DL.save({filename:it.out.name,data:it.out.blob}).then(function(){Endfield.toast('success','已保存 '+it.out.name,'')},saveErr)}
$('b-zip').addEventListener('click',async function(){
  var done=Q.filter(function(it){return it.status==='done'});if(!DL||done.length<2||typeof JSZip==='undefined')return;
  var zip=new JSZip(),used={};
  done.forEach(function(it){var n=it.out.name,k=1;while(used[n]){n=base(it.out.name)+'-'+(++k)+'.'+ext(it.out.name)}used[n]=1;zip.file(n,it.out.blob)});
  var blob=await zip.generateAsync({type:'blob'}),d=new Date(),p=function(v){return String(v).padStart(2,'0')};
  DL.save({filename:'转换结果-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.zip',data:blob}).then(function(){Endfield.toast('success','已保存 '+done.length+' 个文件的压缩包','')},saveErr);
});
$('b-clear').addEventListener('click',function(){if(busy)return;Q.forEach(function(it){if(it.thumb)URL.revokeObjectURL(it.thumb)});Q=[];render()});
$('q-rows').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;var it=Q.find(function(x){return x.id===+b.closest('tr').dataset.id});if(!it)return;
  if(b.dataset.act==='save')save(it);
  if(b.dataset.act==='rm'&&it.status!=='busy'){if(it.thumb)URL.revokeObjectURL(it.thumb);Q.splice(Q.indexOf(it),1);render()}
});

/* 渲染 */
function status(it){
  if(it.status==='busy')return '<span class="fc-busy"><span class="spin spin--16" aria-hidden="true"></span>转换中</span>';
  if(it.status==='done')return '<span class="stat stat--ok">完成</span>';
  if(it.status==='fail')return '<span class="stat stat--err">失败</span><div class="fc-err">'+esc(it.err)+'</div>';
  return '<span class="fc-sub">待转换</span>';
}
function render(){
  var s=settings();
  $('q-rows').innerHTML=Q.map(function(it){
    var target=it.out?it.out.label:FMT_LABEL[it.kind==='image'?s.img:s.tbl];
    var thumb=it.thumb?'<img src="'+it.thumb+'" alt="">':'<svg class="ic"><use href="#i-grid"/></svg>';
    return '<tr data-id="'+it.id+'"><td><div class="fc-file"><span class="fc-thumb">'+thumb+'</span><span class="fc-name"><b><span title="'+esc(it.name)+'">'+esc(it.name)+'</span>'+(it.sample?'<span class="tag tag--sm">示例</span>':'')+'</b><span class="fc-sub">'+(it.kind==='image'?'图片':'表格')+'</span></span></div></td>'+
      '<td><code>'+it.ext.toUpperCase()+'</code></td><td class="num">'+size(it.file.size)+'</td>'+
      '<td><div class="fc-name"><span>'+target+(it.out?'，'+size(it.out.blob.size):'')+'</span>'+(it.out?'<span class="fc-sub">'+esc(it.out.note)+'</span>':'')+'</div></td>'+
      '<td>'+status(it)+'</td>'+
      '<td class="num"><div class="fc-ops"><button class="btn btn--secondary btn--sm" type="button" data-act="save"'+(it.status==='done'&&DL?'':' disabled')+'><span class="lbl">保存</span></button>'+
      '<button class="btn btn--ghost ibtn btn--sm" type="button" data-act="rm" aria-label="移除 '+esc(it.name)+'"'+(it.status==='busy'?' disabled':'')+'><svg class="ic ic--close"><use href="#i-close"/></svg></button></div></td></tr>';
  }).join('');
  var done=Q.filter(function(it){return it.status==='done'}).length,wait=Q.filter(function(it){return it.status==='wait'||it.status==='fail'}).length;
  $('q-wrap').hidden=!Q.length;$('q-empty').hidden=!!Q.length;
  $('sum').textContent=Q.length?'共 '+Q.length+' 个文件，'+done+' 个已完成':'';
  $('b-run').disabled=busy||!wait;$('b-zip').disabled=busy||done<2||!DL;$('b-clear').disabled=busy||!Q.length;
}
